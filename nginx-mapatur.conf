# ============================================
# Configuração Nginx - Mapa Turismo Corumbá
# Domínio: mapatur.corumba.ms.gov.br
# Endurecida contra scanners/exploits (rev. seguranca)
# ============================================

# ATENÇÃO: o bloco abaixo precisa ficar DENTRO do bloco http { } do arquivo
# /etc/nginx/nginx.conf, NÃO aqui. Deixado comentado como referência:
#
#   # Redes isentas de rate limit. Usuários atrás de NAT corporativo (ex.: rede
#   # interna da Prefeitura) chegam TODOS com o mesmo IP de origem. Como o limite
#   # é por IP, a organização inteira dividiria uma única cota e o limite estoura
#   # em minutos — derrubando a API só para quem está na rede interna, enquanto
#   # usuários externos, cada um com seu IP, nunca chegam perto do limite.
#   #
#   # Se a rede interna sair por um IP PÚBLICO de NAT, acrescente-o aqui com "0".
#   geo $mapatur_limitado {
#       default            1;
#       127.0.0.0/8        0;
#       10.0.0.0/8         0;
#       172.16.0.0/12      0;
#       192.168.0.0/16     0;
#   }
#
#   # Chave vazia = requisição não entra na contagem do rate limit
#   map $mapatur_limitado $mapatur_key {
#       0  "";
#       1  $binary_remote_addr;
#   }
#
#   limit_req_zone $mapatur_key zone=mapatur_lim:10m rate=30r/s;

upstream mapatur_api {
    server 127.0.0.1:8010;
    keepalive 64;
}

server {
    server_name mapatur.corumba.ms.gov.br;

    # Logs
    access_log /var/log/nginx/mapatur_access.log;
    error_log /var/log/nginx/mapatur_error.log;

    # FRONTEND (Build estático)
    root /dados/www/mapa_turismo/apps/web/dist;
    index index.html;

    # ----------------------------------------
    # SEGURANÇA
    # ----------------------------------------

    # Esconde a versão do Nginx nas respostas/erros
    server_tokens off;

    # Headers de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # IP real quando atrás de proxy/balanceador interno (172.16.x).
    # Descomente se os IPs 172.16.x nos logs forem de um proxy, e não de usuários finais.
    # set_real_ip_from 172.16.0.0/16;
    # real_ip_header X-Forwarded-For;

    # Bloqueia métodos HTTP fora do esperado (ex.: "LEAKIX")
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # Bloqueia User-Agents de scanners conhecidos
    # (remova "curl" da lista se algum monitor interno legítimo usar curl)
    if ($http_user_agent ~* "l9scan|leakix|nuclei|nmap|masscan|zgrab|sqlmap|python-requests|curl") {
        return 403;
    }

    # Bloqueia arquivos ocultos (.env, .git, .htaccess...) — exceto .well-known (Certbot)
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Bloqueia extensões de backup/config/segredo que não existem neste site
    location ~* \.(env|git|sql|bak|old|backup|ini|conf|config|yml|yaml|log|sh)$ {
        return 404;
    }

    # Site é SPA estático — não roda PHP/ASP/JSP. Nega essas sondagens.
    location ~* \.(php|php5|phtml|asp|aspx|jsp|cgi)$ {
        return 404;
    }

    # ----------------------------------------
    # ROTAS
    # ----------------------------------------

    # Rota para o Frontend (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # BACKEND API (com rate-limiting)
    location /api/ {
        # burst folgado: abrir o mapa dispara várias chamadas de uma vez, e um
        # burst apertado transforma um carregamento normal de página em erro
        limit_req zone=mapatur_lim burst=50 nodelay;
        # 429 (Too Many Requests) descreve a situação melhor que o 503 padrão,
        # que sugere indisponibilidade do serviço
        limit_req_status 429;
        proxy_pass http://mapatur_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # UPLOADS
    location /uploads/ {
        proxy_pass http://mapatur_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # HEALTH CHECK
    location /health {
        proxy_pass http://mapatur_api/health;
        access_log off;
    }

    # Para validação do Certbot (necessário para obter certificado SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ----------------------------------------
    # SSL (managed by Certbot)
    # ----------------------------------------
    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mapatur.corumba.ms.gov.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mapatur.corumba.ms.gov.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# Redirecionamento HTTP -> HTTPS
server {
    if ($host = mapatur.corumba.ms.gov.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name mapatur.corumba.ms.gov.br;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
